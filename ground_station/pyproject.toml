[project]
name = "ground-station"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Burak K.", email = "burakkilnnc@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "pydantic>=2.14.3",
]

[project.scripts]
ground-station = "ground_station:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
